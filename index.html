<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Cyclops Space Pirates</title>
    <meta
      name="description"
      content="A space-pirate clicker and monster-collector game about hiring recruits, opening captured cargo, training through battles, and building a legendary crew."
    />
    <link rel="stylesheet" href="styles.css?v=20260610d" />
    <link rel="stylesheet" href="styles-v2.css?v=20260610d" />
  </head>
  <body>
    <header class="topbar game-header">
      <a class="brand" href="#play" data-route-link="play" aria-label="Cyclops Space Pirates cargo screen">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <strong>Cyclops Space Pirates</strong>
          <small>Cargo crew economy</small>
        </span>
      </a>

      <button class="nav-toggle" type="button" id="navToggle" aria-controls="topNav" aria-expanded="false">
        Menu
      </button>

      <nav class="topnav" id="topNav" aria-label="Primary navigation"></nav>

      <div class="header-tools">
        <button class="sound-button" type="button" id="soundToggle" aria-label="Toggle game sound" aria-pressed="true">
          Sound
        </button>
        <button class="music-button" type="button" id="musicToggle" aria-label="Toggle background music" aria-pressed="true">
          Music
        </button>
        <label class="music-volume-control" for="musicVolume">
          <span>Vol</span>
          <input id="musicVolume" type="range" min="4" max="45" step="1" value="8" aria-label="Music volume" />
          <output id="musicVolumeValue" for="musicVolume">8%</output>
        </label>
      </div>
    </header>

    <main>
      <section class="view" id="home" data-view="home"></section>
      <section class="view is-active" id="play" data-view="play"></section>
      <section class="view" id="characters" data-view="characters"></section>
      <section class="view" id="shop" data-view="shop"></section>
      <section class="view" id="loot" data-view="loot"></section>
      <section class="view" id="training" data-view="training"></section>
      <section class="view" id="arena" data-view="arena"></section>
      <section class="view" id="market" data-view="market"></section>
      <section class="view" id="quests" data-view="quests"></section>
      <section class="view" id="leaderboard" data-view="leaderboard"></section>
      <section class="view" id="docs" data-view="docs"></section>
      <section class="view" id="profile" data-view="profile"></section>
    </main>

    <footer class="site-footer">
      <p>
        Cyclops Space Pirates is a local gameplay alpha. Marketplace ETH and future money-match systems remain
        simulated until audited production services are ready.
      </p>
    </footer>

    <noscript>This game requires JavaScript.</noscript>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <section class="modal-root hidden" id="modalRoot" aria-modal="true" role="dialog"></section>

    <script src="game-data.js?v=20260610d"></script>
    <script src="app-v2.js?v=20260610d"></script>
  </body>
</html>
